name: Validate proposed Green Android fixes
on:
  push:
    branches:
      - ci/validate-green-fixes
permissions:
  contents: read
jobs:
  validate:
    name: Wallet refresh fixes and Meld contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85d057705a8dcedcf9823507e1c6bccee6ca5a9c
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "85d057705a8dcedcf9823507e1c6bccee6ca5a9c"
      - name: Complete shared JVM suites
        run: ./gradlew :data:jvmTest :domain:jvmTest :utils:jvmTest :network:jvmTest :jade:jvmTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process
      - name: Repository unit tests and Android APK build
        if: ${{ !cancelled() }}
        run: ./gradlew useBlockstreamKeys test :androidApp:assembleProductionGoogleDebug --continue --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-refresh-validation-85d0577
          retention-days: 7
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            androidApp/build/outputs/apk/productionGoogle/debug/*.apk
